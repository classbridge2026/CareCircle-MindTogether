name: Verify

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carecircle_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/carecircle_test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical
      - name: Full dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carecircle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carecircle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carecircle_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/carecircle_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carecircle_test
      SMTP_HOST: ""
      SMTP_USER: ""
      SMTP_PASS: ""
      EMAIL_FROM: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:integration
      - run: npm run build
